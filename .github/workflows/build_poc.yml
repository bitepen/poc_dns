name: Build B-0 DNS Probe

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Multiarch Repos & Install Tools
        run: |
          # 1. 限制自带源只拉取 amd64
          sudo sed -i 's/URIs:/Architectures: amd64\nURIs:/g' /etc/apt/sources.list.d/ubuntu.sources

          # 2. 为 arm64 添加专门的 ports.ubuntu.com 源
          sudo tee /etc/apt/sources.list.d/arm64.sources << 'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          # 3. 添加 arm64 架构并更新索引
          sudo dpkg --add-architecture arm64
          sudo apt-get update

          # 4. 安装编译器与依赖库（移除虚拟包 bpftool）
          sudo apt-get install -y \
            clang llvm \
            gcc-aarch64-linux-gnu \
            libbpf-dev:arm64 \
            libelf-dev:arm64 \
            zlib1g-dev:arm64

          # 5. 下载官方独立静态 bpftool (主机 amd64 运行)
          curl -sL https://github.com/libbpf/bpftool/releases/download/v7.4.0/bpftool-v7.4.0-amd64.tar.gz | sudo tar -xzf - -C /usr/local/bin/
          sudo chmod +x /usr/local/bin/bpftool
          bpftool --version

      - name: Compile eBPF & Userspace Loader
        run: |
          # 编译 BPF 字节码
          clang -g -O2 -target bpf -D__TARGET_ARCH_arm64 -c poc_dns.bpf.c -o poc_dns.bpf.o

          # 生成骨架头文件
          bpftool gen skeleton poc_dns.bpf.o > poc_dns.skel.h

          # 交叉编译静态二进制
          aarch64-linux-gnu-gcc -O2 -Wall poc_dns.c -o poc_dns \
            -I/usr/include/aarch64-linux-gnu \
            -L/usr/lib/aarch64-linux-gnu \
            -lbpf -lelf -lz -static

          file poc_dns

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poc_dns-arm64
          path: poc_dns